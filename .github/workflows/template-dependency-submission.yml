name: Template Dependency Graph for Security Analysis

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: number
      repository:
        required: false
        description: The repository to checkout. Should only be used for verifying changes to the workflow itself.
        type: string
        default: ${{ github.repository }}

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          fetch-depth: 1
          repository: ${{ inputs.repository }}
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # 4.7.0
        with:
          distribution: 'corretto'
          java-version: ${{ inputs.java-version }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@94baf225fe0a508e581a564467443d0e2379123b # 4.3.0
        with:
          dependency-graph-exclude-projects: '.*contracttests.*'